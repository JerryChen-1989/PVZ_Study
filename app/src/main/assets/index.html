<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学习花园防御战</title>
<style>
/* ============ 需求文档 V1.0 对应布局：顶部状态栏 + 左侧导航 + 主内容区 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#EFF7E9; overflow:hidden; }

/* ---- 1. 全局状态栏 ---- */
#statusBar {
  height:54px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:linear-gradient(90deg,#3A8C3F,#5CB85C); color:#fff;
  position:fixed; top:0; left:0; right:0; z-index:50;
}
#statusBar .logo { font-size:16px; font-weight:700; margin-right:auto; white-space:nowrap; }
.stat { background:rgba(255,255,255,.18); border-radius:16px; padding:4px 10px; font-size:13px; font-weight:700; white-space:nowrap; }

/* ---- 2. 左侧导航栏 ---- */
#layout { display:flex; height:100%; padding-top:54px; }
#sidebar {
  width:88px; background:#2F6B33; overflow-y:auto; flex-shrink:0;
  display:flex; flex-direction:column; padding:6px 0;
}
.nav-item {
  color:#CFE8CF; text-align:center; padding:10px 2px; cursor:pointer;
  font-size:12px; border-left:4px solid transparent; user-select:none;
}
.nav-item .ic { display:block; font-size:22px; margin-bottom:2px; }
.nav-item.active { background:#3A8C3F; color:#fff; border-left-color:#FFD54F; }
.nav-item.mode { margin-top:auto; background:#245127; color:#FFE082; }

#main { flex:1; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch; }

/* ---- 通用卡片 ---- */
.card { background:#fff; border-radius:14px; padding:12px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.card h3 { font-size:15px; color:#2F6B33; margin-bottom:8px; }
.btn { display:inline-block; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; }
.btn-green { background:#4CAF50; color:#fff; }
.btn-orange { background:#FF9800; color:#fff; }
.btn-red { background:#EF5350; color:#fff; }
.btn-blue { background:#42A5F5; color:#fff; }
.btn-gray { background:#E0E0E0; color:#555; }
.btn:disabled { opacity:.45; }

/* ---- 预警横幅 ---- */
.warn-banner {
  background:linear-gradient(90deg,#FF7043,#EF5350); color:#fff; border-radius:12px;
  padding:10px 12px; font-size:13px; font-weight:700; margin-bottom:12px;
  animation:shake 2.2s infinite;
}
@keyframes shake { 0%,92%,100%{transform:translateX(0)} 94%{transform:translateX(-3px)} 96%{transform:translateX(3px)} 98%{transform:translateX(-2px)} }

/* ---- 花园草坪 ---- */
#lawn { position:relative; border-radius:12px; overflow:hidden; background:repeating-linear-gradient(90deg,#A5D66F 0 20%,#97CD60 20% 40%); }
.lawn-row { display:flex; position:relative; }
.plot {
  flex:1; aspect-ratio:1/1; max-height:88px; border:1px dashed rgba(255,255,255,.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; cursor:pointer; font-size:11px; color:#3c6e21;
}
.plot.hint { animation:blink 1s infinite; background:rgba(255,235,59,.35); }
@keyframes blink { 50%{background:rgba(255,235,59,.65)} }
.plant-emoji { font-size:30px; line-height:1; }
.plant-emoji.hurt { filter:grayscale(.7); opacity:.6; }
.hp-bar { width:70%; height:5px; background:#e0e0e0; border-radius:3px; margin-top:2px; overflow:hidden; }
.hp-fill { height:100%; background:#66BB6A; border-radius:3px; }
.stage-tag { font-size:9px; background:rgba(255,255,255,.75); border-radius:5px; padding:0 4px; margin-top:1px; }
.zombie {
  position:absolute; top:50%; transform:translateY(-50%); font-size:30px; z-index:5;
  transition:left .28s linear; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
}
.zombie.bite { animation:bite .5s infinite; }
@keyframes bite { 50%{transform:translateY(-50%) rotate(-12deg)} }
.pea { position:absolute; top:50%; transform:translateY(-50%); font-size:14px; z-index:4; transition:left .25s linear; }
.boom { position:absolute; font-size:44px; z-index:9; animation:boom .6s forwards; }
@keyframes boom { 0%{transform:scale(.3);opacity:1} 100%{transform:scale(2);opacity:0} }

/* ---- 种子栏 ---- */
#seedBar { display:flex; gap:8px; flex-wrap:wrap; }
.seed {
  width:64px; background:#FFF8E1; border:2px solid #FFE082; border-radius:10px;
  text-align:center; padding:6px 2px; cursor:pointer; font-size:11px; position:relative;
}
.seed .ic { font-size:24px; display:block; }
.seed.sel { border-color:#FF9800; background:#FFE0B2; transform:scale(1.08); }
.seed.lock { filter:grayscale(1); opacity:.5; }
.seed .cnt { position:absolute; top:-6px; right:-6px; background:#EF5350; color:#fff; border-radius:50%; min-width:18px; height:18px; font-size:11px; line-height:18px; }

/* ---- 任务/错题列表 ---- */
.task-item { display:flex; align-items:center; gap:8px; padding:10px 8px; border-bottom:1px solid #F0F0F0; font-size:13px; }
.task-item:last-child { border-bottom:none; }
.task-item .grow { flex:1; }
.task-item .meta { color:#999; font-size:11px; margin-top:2px; }
.tag { display:inline-block; font-size:10px; border-radius:6px; padding:1px 6px; margin-right:4px; }
.tag-type { background:#E3F2FD; color:#1976D2; }
.tag-sun { background:#FFF3E0; color:#EF6C00; }
.tag-done { background:#E8F5E9; color:#2E7D32; }
.tag-overdue { background:#FFEBEE; color:#C62828; }

/* ---- 进度条 ---- */
.pbar { height:12px; background:#EEE; border-radius:6px; overflow:hidden; }
.pbar-fill { height:100%; background:linear-gradient(90deg,#66BB6A,#4CAF50); border-radius:6px; transition:width .4s; }

/* ---- 商城 ---- */
.shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.shop-item { background:#FAFFF5; border:1px solid #DCEDC8; border-radius:12px; padding:10px; text-align:center; font-size:12px; }
.shop-item .ic { font-size:34px; }
.shop-item .nm { font-weight:700; margin:4px 0 2px; }
.shop-item .desc { color:#888; font-size:11px; min-height:28px; }

/* ---- 表单 ---- */
.frm label { display:block; font-size:12px; color:#666; margin:10px 0 4px; }
.frm input,.frm select { width:100%; padding:9px; border:1px solid #DDD; border-radius:8px; font-size:14px; }

/* ---- 图片凭证 / 错题照片 ---- */
.photo-btns { display:flex; gap:8px; margin:8px 0; }
.photo-prev { width:100%; max-height:180px; object-fit:contain; border-radius:10px; border:1px solid #DDD; background:#FAFAFA; display:block; margin:6px 0; }
.thumb { width:44px; height:44px; object-fit:cover; border-radius:8px; border:1px solid #DDD; cursor:pointer; flex-shrink:0; }
.photo-full { width:100%; border-radius:10px; display:block; }

/* ---- 弹窗 / toast ---- */
#modalWrap { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:99; display:none; align-items:center; justify-content:center; padding:20px; }
#modalWrap.show { display:flex; }
#modalBox { background:#fff; border-radius:16px; padding:16px; width:100%; max-width:360px; max-height:82vh; overflow-y:auto; }
#modalBox h3 { color:#2F6B33; margin-bottom:6px; }
#toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; z-index:120; display:none; max-width:86%; text-align:center; }

@media (max-width:420px){ #sidebar{width:66px} .nav-item{font-size:10px} .nav-item .ic{font-size:19px} }
</style>
</head>
<body>

<!-- ============ 模块1：全局状态栏（阳光/金币/待完成/连续打卡） ============ -->
<div id="statusBar">
  <span class="logo">🌻 学习花园</span>
  <span class="stat">☀️ <b id="stSun">0</b></span>
  <span class="stat">💰 <b id="stCoin">0</b></span>
  <span class="stat">📋 待完成 <b id="stTodo">0</b></span>
  <span class="stat">🔥 <b id="stStreak">0</b>天</span>
</div>

<div id="layout">
  <!-- ============ 模块2：左侧导航栏 ============ -->
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

<div id="modalWrap"><div id="modalBox"></div></div>
<div id="toast"></div>

<!-- 隐藏文件输入：拍照（capture 调起相机）/ 相册选图，供打卡凭证与错题拍照共用 -->
<input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileGal" accept="image/*" style="display:none">

<script>
'use strict';
/* =====================================================================
 * 学习花园防御战 —— 按《学习打卡激励软件功能需求文档 V1.0》重构
 * 模块对照：
 *  1 全局状态栏   -> #statusBar / renderStatus()
 *  2 左侧导航栏   -> NAV / renderSidebar()
 *  3/4 学科专区   -> viewSubject()（语/数/英通用，含任务打卡+错题）
 *  5 布置任务弹窗 -> openAssignModal()
 *  6 布置作业总控 -> viewAssign()（进度条+清空+惩罚规则）
 *  7 错题汇总     -> viewWrong()
 *  8 奖励商城     -> viewShop()（种子兑换）
 *  9 家长设置中心 -> viewParent()（可调参数）
 * 10 学习花园+预警 -> viewGarden()（僵尸入侵横幅+种植战斗）
 * 附录联动规则    -> settleNight() / onTaskDone()
 * ===================================================================== */

var SUBJECTS = {
  chinese: { name:'语文', icon:'📖', plant:'sunflower' },
  math:    { name:'数学', icon:'🔢', plant:'peashooter' },
  english: { name:'英语', icon:'🔤', plant:'iceshooter' }
};
var PLANTS = {
  sunflower:  { name:'向日葵',   ic:'🌻', hp:3, role:'produce', desc:'满级后定时产出阳光' },
  peashooter: { name:'豌豆射手', ic:'🌱', hp:3, role:'shoot',   desc:'向僵尸发射豌豆' },
  iceshooter: { name:'寒冰射手', ic:'❄️', hp:3, role:'shoot',   desc:'冰豌豆减速僵尸' },
  nut:        { name:'坚果墙',   ic:'🥜', hp:8, role:'wall',    desc:'高血量抵挡僵尸' },
  scholar:    { name:'竹简书生', ic:'📜', hp:4, role:'shoot',   desc:'语文专属·远程攻击' },
  abacus:     { name:'算盘仙人', ic:'🧮', hp:4, role:'shoot',   desc:'数学专属·快速攻击' },
  dictbloom:  { name:'词典花朵', ic:'📚', hp:4, role:'produce', desc:'英语专属·产阳光' }
};
var ZTYPES = {
  normal: { name:'普通僵尸', ic:'🧟', hp:3,  speed:1.6 },
  cone:   { name:'路障僵尸', ic:'🧟‍♂️', hp:5,  speed:1.3 },
  bucket: { name:'铁桶僵尸', ic:'🤖', hp:8,  speed:1.0 }
};
var SHOP = [
  { id:'sunflower', cost:50,  cur:'sun' },
  { id:'peashooter',cost:100, cur:'sun' },
  { id:'nut',       cost:75,  cur:'sun' },
  { id:'iceshooter',cost:175, cur:'sun' },
  { id:'scholar',   cost:120, cur:'sun' },
  { id:'abacus',    cost:120, cur:'sun' },
  { id:'dictbloom', cost:120, cur:'sun' },
  { id:'cherry',    cost:150, cur:'sun' }
];
var STAGES = ['播种','幼苗','成型','满级'];
var ROWS = 3, COLS = 5;

/* ---------------- 状态存取（localStorage 持久化 + 每日重置） ---------------- */
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function defaultState(){
  return {
    date: todayStr(),
    sun: 100, coins: 50, streak: 0,
    mode: 'child',                    // child / parent
    view: 'garden',
    tasks: {
      chinese: [ { id:1, name:'课外阅读30分钟', type:'阅读', reward:20, ddl:'20:00', done:false } ],
      math:    [ { id:2, name:'口算练习50题',   type:'口算', reward:15, ddl:'19:00', done:false } ],
      english: [ { id:3, name:'课文朗读2遍',    type:'朗读', reward:15, ddl:'19:30', done:false } ]
    },
    nextTaskId: 4,
    wrongs: { chinese:[], math:[], english:[] },
    unlocked: {},                     // 学科植物解锁：完成对应学科作业获得
    seeds: {},                        // 种子库存
    cherry: 0,                        // 樱桃炸弹数量
    plants: [],                       // {row,col,type,stage,hp,maxHp,bornTick}
    zombies: [],                      // {id,row,x,type,hp,slow}
    settled: false,                   // 今日是否已结算过夜晚
    missedYesterday: [],              // 昨日漏做学科（补救用）
    cfg: {                            // 模块9 家长可调参数
      rewardBonusAll: 30,             // 三科全完成额外阳光
      z1: 1, z2: 2, z3: 3,            // 1/2/3科未完成对应僵尸数量
      stealPct: 50,                   // 偷走阳光百分比
      stealOn: true,                  // 偷金币/阳光惩罚开关
      repairOn: true,                 // 补救修复机制开关
      growSec: 45,                    // 每阶段生长秒数
      parentPwd: '1234'               // 家长密码（初始1234，家长设置中可改）
    }
  };
}
var S;
function load(){
  try { S = JSON.parse(localStorage.getItem('pvzStudyV2')) || defaultState(); }
  catch(e){ S = defaultState(); }
  if (!S.cfg) S = defaultState();
  if (!S.cfg.parentPwd) S.cfg.parentPwd = '1234';   // 老存档迁移：补默认密码
  // 每日凌晨自动重置：跨天先结算昨晚，再清空作业状态
  if (S.date !== todayStr()) {
    settleNight(true);
    var miss = missedSubjects();
    S.missedYesterday = miss;
    Object.keys(S.tasks).forEach(function(k){ S.tasks[k].forEach(function(t){ t.done=false; }); });
    S.date = todayStr(); S.settled = false;
    save();
  }
}
function save(){ localStorage.setItem('pvzStudyV2', JSON.stringify(S)); }

/* ---------------- 通用 UI ---------------- */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display='none'; }, 2200);
}
function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalWrap').classList.add('show'); }
function closeModal(){ document.getElementById('modalWrap').classList.remove('show'); pendingPhoto=null; }

/* ---------------- 拍照 / 选图（打卡凭证 + 错题照片共用） ----------------
 * pendingPhoto：当前弹窗里已选好的压缩图 dataURL，确认时写入任务/错题
 * 压缩：canvas 缩到最长边 640px、JPEG 60%，单张约 30~80KB，localStorage 放得下 */
var pendingPhoto = null;
function pickPhoto(mode){   // mode: 'cam' 拍照 | 'gal' 相册
  var input = document.getElementById(mode==='cam'?'fileCam':'fileGal');
  input.value = '';         // 允许连续选同一张
  input.onchange = function(){
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var MAX = 640, w = img.width, h = img.height;
        if (w > MAX || h > MAX){ var k = MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        pendingPhoto = cv.toDataURL('image/jpeg', 0.6);
        var prev = document.getElementById('photoPrev');
        if (prev){ prev.src = pendingPhoto; prev.style.display='block'; }
        toast('📷 照片已添加');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  input.click();
}
/* 弹窗查看大图：kind=task/wrong，按存档定位图片 */
function viewPhoto(kind, sub, key){
  var src = null;
  if (kind==='task'){ S.tasks[sub].forEach(function(t){ if(t.id===+key) src=t.photo; }); }
  else { var w=S.wrongs[sub][+key]; if(w) src=w.img; }
  if (!src){ toast('没有找到图片'); return; }
  openModal('<h3>🖼️ 查看图片</h3><img class="photo-full" src="'+src+'">'
    +'<button class="btn btn-gray" data-action="modal-close" style="width:100%;margin-top:10px">关闭</button>');
}
/* localStorage 超限保护：图片太多时提示清理 */
function safeSave(){
  try { save(); return true; }
  catch(e){ toast('⚠️ 本机存储已满，图片保存失败（旧照片过多，可删除部分错题）'); return false; }
}

function subjectDone(k){ var arr=S.tasks[k]; return arr.length>0 && arr.every(function(t){return t.done;}); }
function missedSubjects(){ return Object.keys(SUBJECTS).filter(function(k){ return S.tasks[k].length>0 && !subjectDone(k); }); }
function todoCount(){ var n=0; Object.keys(S.tasks).forEach(function(k){ S.tasks[k].forEach(function(t){ if(!t.done) n++; }); }); return n; }

/* ---------------- 模块1：全局状态栏 ---------------- */
function renderStatus(){
  document.getElementById('stSun').textContent = S.sun;
  document.getElementById('stCoin').textContent = S.coins;
  document.getElementById('stTodo').textContent = todoCount();
  document.getElementById('stStreak').textContent = S.streak;
}

/* ---------------- 模块2：左侧导航栏 ---------------- */
var NAV = [
  { id:'garden',  ic:'🌻', label:'学习花园' },
  { id:'chinese', ic:'📖', label:'语文' },
  { id:'math',    ic:'🔢', label:'数学' },
  { id:'english', ic:'🔤', label:'英语' },
  { id:'assign',  ic:'📝', label:'布置作业', parent:true },
  { id:'wrong',   ic:'📕', label:'错题汇总' },
  { id:'shop',    ic:'🎁', label:'奖励' },
  { id:'parent',  ic:'⚙️', label:'家长设置', parent:true }
];
function renderSidebar(){
  var html = NAV.map(function(n){
    return '<div class="nav-item'+(S.view===n.id?' active':'')+'" data-nav="'+n.id+'">'
      + '<span class="ic">'+n.ic+'</span>'+n.label+'</div>';
  }).join('');
  html += '<div class="nav-item mode" data-nav="__mode"><span class="ic">'+(S.mode==='child'?'🧒':'👨‍👩‍👧')+'</span>'
        + (S.mode==='child'?'儿童模式':'家长模式')+'</div>';
  document.getElementById('sidebar').innerHTML = html;
}

/* ---------------- 路由 ---------------- */
function go(view){
  var navDef = null;
  for (var i=0;i<NAV.length;i++) if(NAV[i].id===view) navDef=NAV[i];
  if (navDef && navDef.parent && S.mode!=='parent') { askParentGate(view); return; }
  S.view = view; save();
  renderSidebar(); renderMain();
}
function renderMain(){
  stopTick();
  var v = S.view;
  if (v==='garden') viewGarden();
  else if (v==='assign') viewAssign();
  else if (v==='wrong') viewWrong();
  else if (v==='shop') viewShop();
  else if (v==='parent') viewParent();
  else if (SUBJECTS[v]) viewSubject(v);
  renderStatus();
}

/* ---------------- 家长模式验证（密码门） ---------------- */
var gateTarget = null;
function askParentGate(target){
  gateTarget = target || null;
  openModal(
    '<h3>👨‍👩‍👧 家长验证</h3><p style="font-size:13px;color:#666">请输入家长密码（初始密码 1234，可在家长设置中修改）</p>'
    +'<div class="frm"><input id="gateAns" type="password" inputmode="numeric" maxlength="12" placeholder="输入家长密码"></div>'
    +'<div style="margin-top:12px;display:flex;gap:8px">'
    +'<button class="btn btn-green" data-action="gate-ok" style="flex:1">确认</button>'
    +'<button class="btn btn-gray" data-action="modal-close" style="flex:1">取消</button></div>'
  );
  setTimeout(function(){ var i=document.getElementById('gateAns'); if(i) i.focus(); }, 100);
}

/* =====================================================================
 * 模块10：学习花园（种植 + 僵尸入侵预警 + 战斗）
 * ===================================================================== */
var sel = null;      // 当前选中种子
var tickTimer = null, tickN = 0;

function viewGarden(){
  var miss = missedSubjects();
  var html = '';
  // 僵尸入侵预警横幅（需求文档模块10）
  if (miss.length > 0) {
    var names = miss.map(function(k){ return SUBJECTS[k].name; }).join('、');
    var zn = miss.length===1?S.cfg.z1:(miss.length===2?S.cfg.z2:S.cfg.z3);
    html += '<div class="warn-banner">⚠️ 还有 '+names+' 作业没有打卡，今晚 '+zn+' 只僵尸会进攻你的花园！快去完成作业布置防御！</div>';
  } else if (Object.keys(S.tasks).some(function(k){return S.tasks[k].length>0;})) {

function plantAt(r,c){ for(var i=0;i<S.plants.length;i++){ var p=S.plants[i]; if(p.row===r&&p.col===c) return p; } return null; }

function renderLawn(){
  var lawn = document.getElementById('lawn'); if(!lawn) return;
  // 地块与植物
  var plots = lawn.querySelectorAll('.plot');
  plots.forEach(function(el){
    var r=+el.dataset.r, c=+el.dataset.c, p=plantAt(r,c);
    el.classList.toggle('hint', !!sel && !p);
    if (p) {
      var pd = PLANTS[p.type];
      var hurt = p.hp < p.maxHp*0.5;
      el.innerHTML = '<span class="plant-emoji'+(hurt?' hurt':'')+'">'+pd.ic+'</span>'
        + '<div class="hp-bar"><div class="hp-fill" style="width:'+Math.max(0,p.hp/p.maxHp*100)+'%"></div></div>'
        + '<span class="stage-tag">'+STAGES[p.stage]+'</span>';
    } else {
      el.innerHTML = '<span style="opacity:.5">'+(sel?'点我种':'空地')+'</span>';
    }
  });
  // 僵尸（绝对定位在对应行）
  lawn.querySelectorAll('.zombie,.pea').forEach(function(e){ e.remove(); });
  S.zombies.forEach(function(z){
    var rowEl = lawn.querySelector('.lawn-row[data-row="'+z.row+'"]'); if(!rowEl) return;
    var el = document.createElement('div');
    el.className = 'zombie'+(z.biting?' bite':'');
    el.style.left = z.x+'%';
    el.textContent = ZTYPES[z.type].ic;
    rowEl.appendChild(el);
  });
  projectiles.forEach(function(pj){
    var rowEl = lawn.querySelector('.lawn-row[data-row="'+pj.row+'"]'); if(!rowEl) return;
    var el = document.createElement('div');
    el.className='pea'; el.style.left=pj.x+'%';
    el.textContent = pj.ice?'🔵':'🟢';
    rowEl.appendChild(el);
  });
}

/* ---- 战斗循环 ---- */
var projectiles = [];
function startTick(){ stopTick(); tickTimer = setInterval(gameTick, 300); }
function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }

function gameTick(){
  tickN++;
  var dirty = false;
  // 植物生长（家长可配 growSec）
  var growTicks = Math.max(1, Math.round(S.cfg.growSec*1000/300));
  S.plants.forEach(function(p){
    if (p.stage<3 && (tickN - (p.bornTick||0)) % growTicks === 0 && tickN>(p.bornTick||0)) { p.stage++; dirty=true; }
    // 满级产出型植物定时产阳光
    if (p.stage===3 && PLANTS[p.type].role==='produce' && tickN%14===0){ S.sun+=5; dirty=true; }
  });
  // 射手攻击
  S.plants.forEach(function(p){
    var pd = PLANTS[p.type];
    if (pd.role!=='shoot' || p.stage<1) return;
    var has = S.zombies.some(function(z){ return z.row===p.row && z.x > (p.col+1)/COLS*100-8; });
    if (has && tickN%3===0){
      projectiles.push({ row:p.row, x:(p.col+0.7)/COLS*100, ice:p.type==='iceshooter' });
      dirty=true;
    }
  });
  // 弹道推进与命中
  for (var i=projectiles.length-1;i>=0;i--){
    var pj = projectiles[i]; pj.x += 7;
    if (pj.x>102){ projectiles.splice(i,1); continue; }
    for (var j=0;j<S.zombies.length;j++){
      var z=S.zombies[j];
      if (z.row===pj.row && Math.abs(z.x-pj.x)<6){
        z.hp--; if(pj.ice) z.slow=true;
        projectiles.splice(i,1);
        if (z.hp<=0){ S.zombies.splice(j,1); S.sun+=5; toast('击杀'+ZTYPES[z.type].name+' +5☀️'); }
        dirty=true; break;
      }
    }
  }
  // 僵尸移动/啃咬
  S.zombies.forEach(function(z){
    var spd = ZTYPES[z.type].speed * (z.slow?0.5:1);
    var target = null;
    S.plants.forEach(function(p){
      if (p.row===z.row){
        var px=(p.col+0.5)/COLS*100;
        if (px < z.x && (!target || px > (target.col+0.5)/COLS*100)) target=p;
      }
    });
    if (target && z.x - (target.col+0.5)/COLS*100 < 5){
      z.biting = true;
      if (tickN%4===0){
        target.hp--; dirty=true;
        if (target.hp<=0){
          S.plants = S.plants.filter(function(p){ return p!==target; });
          toast('💀 '+PLANTS[target.type].name+' 被啃倒了！');
        }
      }
    } else { z.biting=false; z.x -= spd; dirty=true; }
    if (z.x<-4) z.x=-4;
  });
  if (dirty){ save(); renderLawn(); renderStatus(); }
}

/* ---- 樱桃炸弹 ---- */
function useCherry(){
  if (S.cherry<=0){ toast('没有樱桃炸弹，去商城兑换或完成补救获取'); return; }
  if (S.zombies.length===0){ toast('场上没有僵尸'); return; }
  S.cherry--;
  S.zombies = [];
  S.plants.forEach(function(p){ p.hp=p.maxHp; });
  var lawn=document.getElementById('lawn');
  if(lawn){ var b=document.createElement('div'); b.className='boom'; b.textContent='💥'; b.style.left='40%'; b.style.top='30%'; lawn.appendChild(b); setTimeout(function(){b.remove();},700); }
  save(); viewGarden();
  toast('💥 樱桃炸弹清场！植物血量全部恢复');
}

/* ---- 附录规则：夜晚结算（未完成 → 僵尸入侵/偷阳光） ---- */
function settleNight(isAuto){
  var miss = missedSubjects();
  if (miss.length===0){
    if(!isAuto){ S.streak++; toast('🎉 三科全部完成！连续打卡 '+S.streak+' 天，花园安然无恙'); save(); renderStatus(); }
    return;
  }
  var n, ztype;
  if (miss.length===1){ n=S.cfg.z1; ztype='normal'; }
  else if (miss.length===2){ n=S.cfg.z2; ztype='cone'; S.plants = S.plants.filter(function(p,idx){ return !(p.stage>=1 && p.stage<3 && idx===0); }); }
  else { n=S.cfg.z3; ztype='bucket'; S.plants.forEach(function(p){ p.hp=0; }); S.plants=[]; }
  for (var i=0;i<n;i++){
    S.zombies.push({ id:Date.now()+i, row:i%ROWS, x:96-i*3, type:ztype, hp:ZTYPES[ztype].hp, slow:false });
  }
  if (S.cfg.stealOn){
    var stolen = Math.floor(S.sun * S.cfg.stealPct/100);
    S.sun -= stolen;
    toast('🌙 '+miss.length+'科未完成！'+n+'只'+ZTYPES[ztype].name+'入侵，偷走 '+stolen+' 阳光！');
  } else {
    toast('🌙 '+miss.length+'科未完成！'+n+'只'+ZTYPES[ztype].name+'入侵花园！');
  }
  S.missedYesterday = miss;
  S.settled = true;
  save();
}

/* ---- 附录规则：补救修复 ---- */
function doRepair(){
  if (!S.cfg.repairOn){ toast('家长已关闭补救机制'); return; }
  if (S.missedYesterday.length===0){ toast('没有需要补做的作业'); return; }
  var names = S.missedYesterday.map(function(k){ return SUBJECTS[k].name; }).join('、');
  S.missedYesterday = [];
  S.cherry++;
  save();
  toast('✅ 已补做 '+names+' 作业，获得🍒樱桃炸弹×1，快去清场修复！');
  viewGarden();
}

function confirmTask(k,id){
  var t=null; S.tasks[k].forEach(function(x){ if(x.id===id) t=x; });
  if(!t||t.done) { closeModal(); return; }
  t.done = true;
  if (pendingPhoto){ t.photo = pendingPhoto; pendingPhoto = null; }   // 打卡凭证照片存档
  S.sun += t.reward;
  var msg = '✅ 打卡成功 +'+t.reward+'☀️';
  // 单科全完成 → 解锁学科专属植物 + 种子
  if (subjectDone(k)){
    var pid = SUBJECTS[k].plant;
    S.unlocked[pid] = true;
    S.seeds[pid] = (S.seeds[pid]||0)+1;
    msg += '，'+SUBJECTS[k].name+'全部完成，解锁'+PLANTS[pid].ic+PLANTS[pid].name+'×1！';
  }
  // 三科全完成 → 额外阳光 + 植物满血 + 连击
  if (missedSubjects().length===0){
    S.sun += S.cfg.rewardBonusAll;
    S.plants.forEach(function(p){ p.hp=p.maxHp; });
    S.streak++;
    msg += ' 🎉 三科全部打卡：额外+'+S.cfg.rewardBonusAll+'☀️，全部植物满血，连续'+S.streak+'天！';
  }
  if (!safeSave()){ delete t.photo; save(); }   // 存储超限则丢弃照片但保留打卡状态
  closeModal(); toast(msg); renderMain();
}

function viewWrong(){
  var html = '<div class="card"><h3>📕 错题汇总</h3><div class="shop-grid">';
  Object.keys(SUBJECTS).forEach(function(k){
    var n = S.wrongs[k].length, undone = S.wrongs[k].filter(function(w){return !w.redone;}).length;
    html += '<div class="shop-item" data-nav-card="'+k+'" style="cursor:pointer">'
      + '<div class="ic">'+SUBJECTS[k].icon+'</div><div class="nm">'+SUBJECTS[k].name+'</div>'
      + '<div class="desc">共 '+n+' 题 · 待重做 '+undone+' 题</div>'
      + '<button class="btn btn-blue" style="font-size:12px">查看详情</button></div>';
  });
  html += '</div></div>'
    + '<div class="card" style="background:#FFF8E1"><b style="font-size:13px;color:#EF6C00">💡 错题重做打卡每题奖励 5☀️，及时消灭错题让防线更牢固！</b></div>';
  document.getElementById('main').innerHTML = html;
}

/* =====================================================================

    if (it.id==='cherry'){
      html += '<div class="shop-item"><div class="ic">🍒</div><div class="nm">樱桃炸弹</div>'
        + '<div class="desc">清除全场僵尸并恢复植物血量</div>'
        + '<button class="btn btn-orange" data-action="buy" data-id="cherry" data-cost="'+it.cost+'">'+it.cost+'☀️ 兑换</button></div>';
      return;
    }
    var p = PLANTS[it.id];
    html += '<div class="shop-item"><div class="ic">'+p.ic+'</div><div class="nm">'+p.name+'</div>'
      + '<div class="desc">'+p.desc+'</div>'
      + '<button class="btn btn-orange" data-action="buy" data-id="'+it.id+'" data-cost="'+it.cost+'">'+it.cost+'☀️ 兑换</button></div>';

  html += '</div></div>'
    + '<div class="card"><h3>🏅 虚拟奖励（连续打卡兑换）</h3><div class="shop-grid">'
    + '<div class="shop-item"><div class="ic">🥜</div><div class="nm">坚果护盾</div><div class="desc">连续打卡3天免费兑换1个</div>'
    + '<button class="btn '+(S.streak>=3?'btn-green':'btn-gray')+'" data-action="claim-nut">'+(S.streak>=3?'免费领取':'需连击3天')+'</button></div>'
    + '<div class="shop-item"><div class="ic">🏆</div><div class="nm">电子奖状</div><div class="desc">200☀️ 兑换学习之星奖状</div>'
    + '<button class="btn btn-orange" data-action="buy-virtual" data-cost="200" data-nm="电子奖状">200☀️ 兑换</button></div>'
    + '<div class="shop-item"><div class="ic">🖼️</div><div class="nm">卡通头像框</div><div class="desc">150☀️ 兑换限定头像框</div>'
    + '<button class="btn btn-orange" data-action="buy-virtual" data-cost="150" data-nm="卡通头像框">150☀️ 兑换</button></div>'
    + '<div class="shop-item"><div class="ic">🎨</div><div class="nm">花园皮肤</div><div class="desc">300☀️ 解锁星空花园皮肤</div>'
    + '<button class="btn btn-orange" data-action="buy-virtual" data-cost="300" data-nm="花园皮肤">300☀️ 兑换</button></div>'
    + '</div></div>';
  document.getElementById('main').innerHTML = html;
}
function buySeed(id, cost){
  if (S.sun < cost){ toast('阳光不足，还差 '+(cost-S.sun)+'☀️，快去完成作业赚阳光！'); return; }
  S.sun -= cost;
  if (id==='cherry'){ S.cherry++; toast('🍒 樱桃炸弹 +1'); }
  else { S.seeds[id]=(S.seeds[id]||0)+1; S.unlocked[id]=true; toast(PLANTS[id].ic+' '+PLANTS[id].name+'种子 +1，去花园种植吧！'); }
  save(); renderStatus(); }

/* =====================================================================
 * 模块9：家长设置中心
 * ===================================================================== */
function viewParent(){
  var c = S.cfg;
  var html = '<div class="card"><h3>⚙️ 家长设置中心</h3><div class="frm">'
    +'<label>三科全完成额外奖励阳光</label><input id="cBonus" type="number" value="'+c.rewardBonusAll+'">'
    +'<label>1 科未完成 → 普通僵尸数量</label><input id="cZ1" type="number" value="'+c.z1+'">'
    +'<label>2 科未完成 → 路障僵尸数量</label><input id="cZ2" type="number" value="'+c.z2+'">'
    +'<label>3 科未完成 → 铁桶僵尸数量</label><input id="cZ3" type="number" value="'+c.z3+'">'
    +'<label>偷走阳光比例（%）</label><input id="cSteal" type="number" value="'+c.stealPct+'">'
    +'<label>偷阳光惩罚开关</label><select id="cStealOn"><option value="1"'+(c.stealOn?' selected':'')+'>开启</option><option value="0"'+(!c.stealOn?' selected':'')+'>关闭</option></select>'
    +'<label>补救修复机制</label><select id="cRepairOn"><option value="1"'+(c.repairOn?' selected':'')+'>开启</option><option value="0"'+(!c.repairOn?' selected':'')+'>关闭</option></select>'
    +'<label>植物每阶段生长时间（秒）</label><input id="cGrow" type="number" value="'+c.growSec+'">'
    +'</div><button class="btn btn-green" data-action="cfg-save" style="width:100%;margin-top:14px">💾 保存设置</button></div>'
    // 家长密码修改（验证门用）
    +'<div class="card"><h3>🔑 修改家长密码</h3><div class="frm">'
    +'<label>新密码（4~12位，仅本机保存）</label><input id="cPwd1" type="password" maxlength="12" placeholder="输入新密码">'
    +'<label>再输一遍确认</label><input id="cPwd2" type="password" maxlength="12" placeholder="重复新密码">'
    +'</div><button class="btn btn-orange" data-action="pwd-save" style="width:100%;margin-top:14px">🔑 修改密码</button></div>'
    +'<div class="card" style="background:#FFF3E0"><b style="font-size:13px;color:#E65100">提示：布置作业与家长设置需要输入家长密码进入（初始密码 1234）；切回儿童模式后孩子无法修改。</b></div>';
  document.getElementById('main').innerHTML = html;
}
function saveCfg(){
  var g=function(id){ return document.getElementById(id); };
  S.cfg.rewardBonusAll = Math.max(0, parseInt(g('cBonus').value)||30);
  S.cfg.z1 = Math.max(0, parseInt(g('cZ1').value)||1);
  S.cfg.z2 = Math.max(0, parseInt(g('cZ2').value)||2);
  S.cfg.z3 = Math.max(0, parseInt(g('cZ3').value)||3);
  S.cfg.stealPct = Math.min(100, Math.max(0, parseInt(g('cSteal').value)||50));
  S.cfg.stealOn = g('cStealOn').value==='1';
  S.cfg.repairOn = g('cRepairOn').value==='1';
  S.cfg.growSec = Math.max(5, parseInt(g('cGrow').value)||45);
  save(); toast('✅ 设置已保存');
}
/* ---- 修改家长密码 ---- */
function savePwd(){
  var p1=document.getElementById('cPwd1').value, p2=document.getElementById('cPwd2').value;
  if (p1.length<4){ toast('密码至少4位'); return; }
  if (p1!==p2){ toast('两次输入不一致'); return; }
  S.cfg.parentPwd = p1;
  save(); toast('🔑 家长密码已修改，下次验证请用新密码');
  document.getElementById('cPwd1').value=''; document.getElementById('cPwd2').value='';
}

/* =====================================================================
 * 全局事件委托（绑定常驻节点，避免 DOM 重建后点击落空）
 * ===================================================================== */
document.getElementById('sidebar').addEventListener('click', function(e){
  var el = e.target.closest('.nav-item'); if(!el) return;
  var id = el.dataset.nav;
  if (id==='__mode'){
    if (S.mode==='child'){ askParentGate(null); }
    else { S.mode='child'; save(); renderSidebar(); toast('已切回🧒儿童模式'); if(S.view==='parent'||S.view==='assign'){ go('garden'); } }
    return;
  }
  go(id);
});

document.getElementById('main').addEventListener('click', function(e){
  // 种子选择
  var seed = e.target.closest('.seed');
  if (seed){
    var pid = seed.dataset.seed;
    if (!(S.seeds[pid]>0)){ toast('还没有'+PLANTS[pid].name+'种子：完成对应学科作业或去商城兑换'); return; }
    sel = (sel===pid?null:pid);
    renderSeedBar(); renderLawn(); return;
  }
  // 地块种植
  var plot = e.target.closest('.plot');
  if (plot){
    var r=+plot.dataset.r, c=+plot.dataset.c;
    if (!sel){ var p=plantAt(r,c); if(p) toast(PLANTS[p.type].ic+PLANTS[p.type].name+'·'+STAGES[p.stage]+'·血量'+p.hp+'/'+p.maxHp); else toast('先在下方点选一张种子卡'); return; }
    if (plantAt(r,c)){ toast('这块地已经有植物了'); return; }
    S.seeds[sel]--;
    S.plants.push({ row:r, col:c, type:sel, stage:0, hp:PLANTS[sel].hp, maxHp:PLANTS[sel].hp, bornTick:tickN });
    toast('🌱 '+PLANTS[sel].name+'已种下，'+S.cfg.growSec+'秒长一阶段');
    if (!(S.seeds[sel]>0)) sel=null;
    save(); renderSeedBar(); renderLawn(); return;
  }
  // 错题汇总卡片跳转
  var card = e.target.closest('[data-nav-card]');
  if (card){ go(card.dataset.navCard); return; }
  // 按钮动作
  var btn = e.target.closest('[data-action]'); if(!btn) return;
  var act = btn.dataset.action;
  if (act==='task-done') onTaskDone(btn.dataset.sub, +btn.dataset.id);
  else if (act==='view-photo') viewPhoto(btn.dataset.kind, btn.dataset.sub, btn.dataset.key);
  else if (act==='wrong-add') openWrongAdd(btn.dataset.sub);
  else if (act==='wrong-redo') redoWrong(btn.dataset.sub, +btn.dataset.idx);
  else if (act==='use-cherry') useCherry();
  else if (act==='repair') doRepair();
  else if (act==='sim-night'){ if(S.settled){ toast('今晚已经结算过了'); } else settleNight(false); renderMain(); }
  else if (act==='assign-open') openAssignModal();
  else if (act==='clear-sub'){ S.tasks[btn.dataset.sub]=[]; save(); toast('已清空'+SUBJECTS[btn.dataset.sub].name+'任务'); renderMain(); }
  else if (act==='task-del'){
    var k=btn.dataset.sub, id=+btn.dataset.id;
    S.tasks[k]=S.tasks[k].filter(function(t){return t.id!==id;});
    save(); toast('已删除'); renderMain();
  }
  else if (act==='buy') buySeed(btn.dataset.id, +btn.dataset.cost);
  else if (act==='buy-virtual'){
    var cost=+btn.dataset.cost;
    if (S.sun<cost){ toast('阳光不足'); return; }
    S.sun-=cost; save(); renderStatus(); toast('🎉 兑换成功：'+btn.dataset.nm);
  }
  else if (act==='claim-nut'){
    if (S.streak<3){ toast('连续打卡满3天才能免费领取'); return; }
    S.seeds.nut=(S.seeds.nut||0)+1; S.unlocked.nut=true; save(); toast('🥜 坚果护盾种子 +1');
  }
  else if (act==='cfg-save') saveCfg();
  else if (act==='pwd-save') savePwd();
});

document.getElementById('modalWrap').addEventListener('click', function(e){
  if (e.target.id==='modalWrap'){ closeModal(); return; }
  var btn = e.target.closest('[data-action]'); if(!btn) return;
  var act = btn.dataset.action;
  if (act==='modal-close') closeModal();
  else if (act==='pick-cam') pickPhoto('cam');
  else if (act==='pick-gal') pickPhoto('gal');
  else if (act==='task-confirm') confirmTask(btn.dataset.sub, +btn.dataset.id);
  else if (act==='wrong-save') saveWrong(btn.dataset.sub);
  else if (act==='assign-save') saveAssign();
  else if (act==='gate-ok'){
    var pwd = document.getElementById('gateAns').value;
    if (pwd === S.cfg.parentPwd){
      S.mode='parent'; save(); closeModal(); renderSidebar();
      toast('✅ 家长验证通过');
      if (gateTarget){ var t=gateTarget; gateTarget=null; go(t); }
    } else { toast('密码不对，再试一次'); }
  }
});

/* ---------------- 启动 ---------------- */
load();
renderSidebar();
renderMain();
</script>
