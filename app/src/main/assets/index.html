<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>作业花园防御战</title>
<style>
  /* ===== 配色:草绿 + 浅天蓝 + 米白 ===== */
  :root{
    --grass:#7BC47F; --grass-dark:#3A8C3F; --grass-soft:#C8E6C9;
    --sky:#BFE0F5; --cream:#FFF8E7; --cream-deep:#F5E9C9;
    --warn:#E76F51; --sun:#F2C94C; --coin:#C9A227;
    --text:#3A4A3A; --text-sub:#7C8B7A; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  body{
    margin:0; background:var(--cream); color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:10px;}
  /* 顶部状态条 */
  .topbar{
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(90deg,#FFF6D6,#FFEAB6);
    border-radius:14px; padding:10px 14px; margin-bottom:12px;
    font-weight:700; color:#6B4F1D; font-size:14px;
  }
  .topbar .stat{display:inline-flex; align-items:center; gap:4px;}
  /* 主布局:手机竖排 */
  main{display:flex; gap:14px; align-items:flex-start; flex-direction:column;}
  .left,.right{width:100%;}
  @media(min-width:760px){ main{flex-direction:row;} .left{width:320px; flex:none;} .right{flex:1; min-width:0;} }
  .card{
    background:var(--card); border-radius:16px; padding:14px;
    margin-bottom:12px; box-shadow:0 4px 14px rgba(58,140,63,.12);
    border:2px solid var(--cream-deep);
  }
  .title-bar{display:flex; align-items:center; gap:8px; font-weight:700;
    color:var(--grass-dark); margin:0 0 10px; font-size:16px;}
  .muted{color:var(--text-sub); font-size:13px;}
  /* 作业卡片 */
  .subj{
    display:flex; align-items:center; gap:10px; padding:12px;
    border-radius:12px; background:#FAFAFA; border:2px solid #EEE;
    margin-bottom:10px; cursor:pointer; transition:.15s;
  }
  .subj.on{background:var(--grass-soft); border-color:var(--grass-dark);}
  .subj .ic{font-size:30px;}
  .subj .name{font-weight:700;}
  .subj .arrow{margin-left:auto; font-size:22px; color:var(--grass-dark);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:9px 14px; border-radius:999px; border:none; cursor:pointer;
    font-size:13px; font-weight:700; color:#fff; background:var(--grass);
    box-shadow:0 3px 8px rgba(58,140,63,.25); margin:4px 4px 0 0;
  }
  .btn.primary{background:var(--grass-dark);}
  .btn.warn{background:var(--warn);}
  .btn.ghost{background:#fff; color:var(--grass-dark); border:2px solid var(--grass); box-shadow:none;}
  /* 预警 */
  .warning{
    background:#FFE3D8; color:#B23A1F; border:2px solid var(--warn);
    border-radius:12px; padding:10px 14px; margin-bottom:12px;
    font-weight:700; animation:shake .6s ease-in-out infinite; font-size:14px;
  }
  /* 操作提示条(替代 alert) */
  #toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px);
    background:rgba(40,50,40,.92); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:14px; font-weight:700; z-index:99; opacity:0; pointer-events:none;
    transition:.25s; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* 当前模式提示(选中种子/铲子) */
  #modeBar{
    display:none; align-items:center; gap:8px; margin-bottom:8px;
    background:#FFF6D6; border:2px dashed var(--coin); border-radius:10px;
    padding:8px 12px; font-size:14px; font-weight:700; color:#6B4F1D;
  }
  #modeBar.show{display:flex;}
  #modeBar .cancel{margin-left:auto; color:var(--warn); cursor:pointer;}
  /* 草坪 */
  .lawn{
    position:relative; border-radius:18px; padding:8px;
    background:linear-gradient(180deg,#8BC34A,#689F38);
    border:6px solid #5D4037;
    box-shadow:inset 0 -8px 20px rgba(0,0,0,.15);
  }
  .night{position:absolute; inset:0; border-radius:12px; background:rgba(40,30,80,.45); pointer-events:none; z-index:5;}
  .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}
  .cell{
    aspect-ratio:1/1.05; position:relative; border-right:2px dashed rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(255,255,255,.06); border-radius:6px;
  }
  .cell:nth-child(2n){background:rgba(0,0,0,.04);}
  /* 种植模式下空地高亮,引导孩子点哪里 */
  .planting .cell.empty{outline:3px dashed rgba(255,235,120,.85); outline-offset:-4px; animation:sunp 1.2s infinite;}
  .plant{display:flex; flex-direction:column; align-items:center; animation:fade .3s; pointer-events:none;}
  .plant.low{filter:saturate(.4) brightness(.9);}
  .plant.full .pe{filter:drop-shadow(0 0 6px gold); animation:sunp 1.5s infinite;}
  .pe{font-size:40px; line-height:1;}
  .stage{position:absolute; top:2px; left:2px; font-size:10px; padding:1px 5px;
    background:var(--grass-soft); color:var(--grass-dark); border-radius:6px; pointer-events:none;}
  .hp{display:flex; gap:2px; position:absolute; bottom:3px; pointer-events:none;}
  .hp i{width:11px; height:6px; border-radius:2px; background:rgba(0,0,0,.25);}
  .hp i.on{background:#4CAF50;}
  .z{position:absolute; right:6%; top:8%; z-index:3; font-size:38px; pointer-events:none;}
  .z.walk{animation:zwalk .8s infinite;}
  .z.eat{animation:shake .3s linear infinite;}
  .suntok{position:absolute; left:50%; top:6%; transform:translateX(-50%); z-index:4;
    background:radial-gradient(circle,#FFE066,#F2C94C); color:#8A6A0A; font-weight:800;
    font-size:13px; padding:4px 10px; border-radius:999px; border:2px solid #B8860B; cursor:pointer;
    animation:sunp 1.2s infinite;}
  .proj{position:absolute; right:0; top:38%; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle,#8BC34A,#33691E); z-index:3; animation:fly 1.1s linear forwards; pointer-events:none;}
  .proj.snow{background:radial-gradient(circle,#E0F7FA,#4FC3F7);}
  .blast{position:absolute; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    font-size:64px; pointer-events:none; animation:blast .9s forwards;}
  /* 种子卡 */
  .seedbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--cream); border:3px solid var(--coin); border-radius:14px; padding:10px; margin-top:12px;}
  .seedslots{display:flex; gap:8px; flex-wrap:wrap;}
  .seed{display:flex; flex-direction:column; align-items:center; width:70px; padding:6px;
    background:#fff; border-radius:12px; border:2px solid var(--coin); position:relative; cursor:pointer;}
  .seed.locked{opacity:.4; filter:grayscale(.6);}
  .seed.sel{border-color:var(--grass-dark); background:var(--grass-soft);
    box-shadow:0 0 0 3px rgba(58,140,63,.35); transform:scale(1.06);}
  .seed .pe{font-size:30px; pointer-events:none;}
  .seed .nm{font-size:12px; font-weight:700; pointer-events:none;}
  .seed .cost{font-size:11px; color:var(--coin); pointer-events:none;}
  .seed .lock{position:absolute; top:0; right:2px; font-size:14px; pointer-events:none;}
  .seedlabel{font-size:13px; color:#8A6A0A; font-weight:700; flex:none;}
  /* 道具栏 */
  .tools{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .tool{flex:1; min-width:60px; display:flex; flex-direction:column; align-items:center; padding:8px 0;
    background:var(--cream); border:2px solid var(--coin); border-radius:12px; font-size:12px; color:#6B4F1D; cursor:pointer;}
  .tool.sel{border-color:var(--grass-dark); background:var(--grass-soft);}
  .tool .e{font-size:24px; pointer-events:none;}
  /* 日志 */
  .log{margin-top:10px; padding:8px 10px; background:rgba(0,0,0,.55); color:#fff;
    border-radius:10px; font-size:12px; height:84px; overflow:hidden;}
  .log div{line-height:1.5;}
  details.testbox{margin-top:6px;}
  details.testbox summary{font-size:12px; color:var(--text-sub); cursor:pointer;}
  /* 动画 */
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-3deg)}
    40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  @keyframes fade{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
  @keyframes sunp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes zwalk{0%{transform:translateX(0)}50%{transform:translateX(-8px)}100%{transform:translateX(0)}}
  @keyframes blast{0%{transform:scale(.4); opacity:1}60%{transform:scale(1.6); opacity:.9}100%{transform:scale(2.4); opacity:0}}
  @keyframes fly{from{right:0; opacity:1}to{right:100%; opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶部资源条 -->
  <div class="topbar">
    <span class="stat">☀️ <b id="sun">0</b></span>
    <span class="stat">🪙 <b id="coin">0</b></span>
    <span class="stat">🔥 连续 <b id="streak">0</b> 天</span>
    <span class="stat" style="margin-left:auto">📦 已解锁 <b id="unlocked">0</b></span>
  </div>

  <main>
    <!-- 右:我的花园(手机上放最前) -->
    <section class="right">
      <div id="warnBox"></div>
      <!-- 当前操作模式提示条 -->
      <div id="modeBar"><span id="modeTxt"></span><span class="cancel" id="modeCancel">✖ 取消</span></div>
      <div class="lawn" id="lawn">
        <div id="nightLayer" class="night" style="display:none"></div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- 种子卡牌槽 -->
      <div class="seedbar">
        <span class="seedlabel">植物卡</span>
        <div class="seedslots" id="seedBar"></div>
      </div>

      <!-- 道具栏 -->
      <div class="tools" id="toolBar">
        <div class="tool" data-tool="cherry_bomb"><span class="e">🍒</span>樱桃 x<span id="invCherry">0</span></div>
        <div class="tool" data-tool="wall_nut"><span class="e">🥜</span>坚果 x<span id="invWall">0</span></div>
        <div class="tool" data-tool="shop"><span class="e">🛒</span>商店</div>
        <div class="tool" data-tool="repair"><span class="e">🛠️</span>补救</div>
        <div class="tool" data-tool="shovel"><span class="e">🔧</span><span id="shovelTxt">铲植物</span></div>
      </div>

      <div class="log" id="log"></div>
    </section>

    <!-- 左:今日作业(联动触发源) -->
    <section class="left">
      <div class="card">
        <div class="title-bar">📚 今日作业打卡</div>
        <div id="subjList"></div>
        <details class="testbox">
          <summary>🧪 测试工具(家长/调试用)</summary>
          <button class="btn primary" data-demo="all">✅ 一键三科完成</button>
          <button class="btn warn" data-demo="miss">⚠️ 模拟漏做1科</button>
          <button class="btn ghost" data-demo="unlock">🔓 解锁全部植物</button>
          <button class="btn ghost" data-demo="reset">♻️ 清空存档重来</button>
        </details>
      </div>
      <div class="card">
        <div class="title-bar">⚙️ 家长配置</div>
        <div class="muted">单科奖励 ☀️<input id="cfgPer" value="5" style="width:40px"> ·
          全完成额外 ☀️<input id="cfgAll" value="20" style="width:40px"><br>
          漏1科僵尸 <input id="cfgZ1" value="3" style="width:36px"> ·
          漏2科 <input id="cfgZ2" value="6" style="width:36px"> ·
          漏3科 <input id="cfgZ3" value="9" style="width:36px"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
/* =========================================================================
 * 作业花园防御战 · 正式版(Android WebView)
 * 与小程序版 pages/garden + utils/daily.js 逻辑一一对应
 * 联动核心:
 *   1) finishSubject()  作业打卡 → 加阳光 + 解锁对应学科植物(+三科全满血)
 *   2) checkUnfinished() 漏做 → 预警 + 刷僵尸波(普通/路障/铁桶)
 *   3) goRepair()        补做 → 发樱桃炸弹 + 清场 + 植物回血
 *   4) gameTick()        战斗循环:僵尸移动/啃植物/植物攻击/生长
 *
 * v1.1 修复:
 *   - 种植点击失效:改为事件委托绑定在 #grid 容器上(容器不会被
 *     innerHTML 重建销毁,点击必达),配合 touch-action:manipulation
 *   - alert 静默:WebView 需 WebChromeClient 才弹 alert,
 *     全部改为页内 toast 提示
 *   - 选中种子高亮 + 空地引导闪烁 + 顶部模式提示条
 *   - localStorage 存档 + 按日期每日重置(对应 ensureDailyReset)
 * ========================================================================= */

// 植物元数据(与 utils/plants.js 一致)
const PLANTS = {
  sunflower:    {name:'向日葵',   subject:'chinese', hp:3, price:3, attack:0, sunPerSec:0.83},
  pea_shooter:  {name:'豌豆射手', subject:'math',    hp:3, price:5, attack:1, attackInterval:2400},
  snow_pea:     {name:'寒冰射手', subject:'english', hp:3, price:7, attack:1, attackInterval:2400, slow:true},
  wall_nut:     {name:'坚果墙',   subject:null,      hp:8, price:4, attack:0},
  cherry_bomb:  {name:'樱桃炸弹', subject:null,      hp:1, price:8, attack:99, oneShot:true},
  bamboo_scholar:{name:'竹简书生',subject:'chinese', hp:3, price:6, attack:0},
  abacus_immortal:{name:'算盘仙人',subject:'math',  hp:3, price:6, attack:2, attackInterval:2400},
  dict_flower:  {name:'词典花朵', subject:'english', hp:3, price:6, attack:1, attackInterval:2400}
};
const ZOMBIES = { normal:{name:'普通僵尸',hp:1}, cone:{name:'路障僵尸',hp:2}, bucket:{name:'铁桶僵尸',hp:3} };
const STAGE_NAMES = ['种子','幼苗','成型','满级'];
const EMOJI = {sunflower:'🌻', pea_shooter:'🌱', snow_pea:'❄️', wall_nut:'🥜', cherry_bomb:'🍒', bamboo_scholar:'🎋', abacus_immortal:'🧮', dict_flower:'📖'};
const ZEMOJI = {normal:'🧟', cone:'🧟‍♂️', bucket:'🧟‍♀️'};
const SEED_ORDER = ['sunflower','pea_shooter','snow_pea','wall_nut','cherry_bomb','bamboo_scholar','abacus_immortal','dict_flower'];

const COLS=5, ROWS=3;
const SAVE_KEY = 'pvz_garden_save_v1';

// 运行时配置(对应 utils/config.js DEFAULT_CONFIG,可由家长面板改)
let cfg = { reward_per_subject:5, reward_all_bonus:20, zombie_1_count:3, zombie_2_count:6, zombie_3_count:9, coin_steal_ratio:0.5 };

// 全局状态
let state = {
  sun:20, coin:100, streak:0,
  plants:[], zombies:[], sunTokens:[], peaprojs:[], blasts:[],
  inv:{cherry_bomb:0, wall_nut:1},
  shop_unlocked:{},
  log:[]
};
// 作业状态(对应 assignments 集合)
let subjects = {
  chinese:{name:'语文', plant:'sunflower', done:false},
  math:   {name:'数学', plant:'pea_shooter', done:false},
  english:{name:'英语', plant:'snow_pea', done:false}
};

let selectedSeed = null, shovelMode = false, coinStolen = false;

/* ---------- 工具 ---------- */
function $(id){ return document.getElementById(id); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function pushLog(m){ state.log.unshift(m); if(state.log.length>5) state.log.pop(); $('log').innerHTML = state.log.map(x=>`<div>› ${x}</div>`).join(''); }
// 页内提示(替代 alert,WebView 不弹 alert)
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 存档:localStorage 持久化 + 每日重置 ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      date: todayStr(),
      sun:state.sun, coin:state.coin, streak:state.streak,
      plants:state.plants, inv:state.inv, shop_unlocked:state.shop_unlocked,
      subjects:{chinese:subjects.chinese.done, math:subjects.math.done, english:subjects.english.done},
      coinStolen, cfg
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    state.sun=s.sun??20; state.coin=s.coin??100; state.streak=s.streak??0;
    state.plants=s.plants||[]; state.inv=s.inv||{cherry_bomb:0,wall_nut:1};
    state.shop_unlocked=s.shop_unlocked||{};
    if(s.cfg) cfg=s.cfg;
    // 每日重置(对应 utils/daily.js ensureDailyReset):
    // 跨天 → 清空作业状态、僵尸判定重新开始;花园植物保留
    if(s.date===todayStr()){
      subjects.chinese.done=!!(s.subjects&&s.subjects.chinese);
      subjects.math.done=!!(s.subjects&&s.subjects.math);
      subjects.english.done=!!(s.subjects&&s.subjects.english);
      coinStolen=!!s.coinStolen;
    } else {
      coinStolen=false;
      pushLog('🌅 新的一天,作业状态已重置');
    }
  }catch(e){}
}

/* ===== 联动核心 1:作业打卡完成 ===== */
function finishSubject(subj){
  if(subjects[subj].done){ toast(subjects[subj].name+' 今天已打卡 ✓'); return; }
  subjects[subj].done = true;
  const done = finishedCount();
  const add = done===3 ? (cfg.reward_per_subject*3 + cfg.reward_all_bonus) : cfg.reward_per_subject;
  state.sun += add;
  // 解锁该学科专属植物
  const pt = subjects[subj].plant;
  state.shop_unlocked[pt] = true;
  // 场上没有则送一株幼苗
  if(!state.plants.some(p=>p.type===pt)){
    const usedX = state.plants.filter(p=>p.y===0).map(p=>p.x);
    let freeX = 0; while(usedX.includes(freeX)&&freeX<COLS-1) freeX++;
    state.plants.push({id:'p'+Date.now(), type:pt, subject:subj, stage:1, hp:PLANTS[pt].hp, x:freeX, y:0, planted_at:Date.now()});
  }
  if(done===3){
    state.streak += 1;
    state.plants.forEach(p=> p.hp = PLANTS[p.type].hp);
    pushLog(`🎉 三科全完成!阳光+${add},全部植物满血,连续 ${state.streak} 天`);
    toast('🎉 三科全完成!阳光+'+add);
  } else {
    pushLog(`✅ ${subjects[subj].name}打卡完成 ☀️+${cfg.reward_per_subject},解锁${PLANTS[pt].name}`);
    toast('✅ '+subjects[subj].name+'打卡 ☀️+'+cfg.reward_per_subject+',解锁'+PLANTS[pt].name);
  }
  saveState(); render(); checkUnfinished();
}

/* ===== 联动核心 2:漏做检测 → 预警 + 刷僵尸 ===== */
function finishedCount(){ return Object.values(subjects).filter(s=>s.done).length; }
function checkUnfinished(){
  const unfinished = 3 - finishedCount();
  const box = $('warnBox');
  if(unfinished>0){
    box.innerHTML = `<div class="warning">⚠️ 还有 <b>${unfinished}</b> 科作业没打卡,今晚僵尸会进攻你的花园!快去打卡领取防御植物!</div>`;
    $('nightLayer').style.display = 'block';
    if(!coinStolen){
      const lost = Math.floor(state.coin * cfg.coin_steal_ratio);
      state.coin -= lost; coinStolen = true;
      pushLog(`💸 漏做作业!系统僵尸偷走 ${lost} 金币`);
    }
    if(state.zombies.length===0) spawnWave(unfinished);
  } else {
    box.innerHTML = '';
    $('nightLayer').style.display = 'none';
  }
  saveState();
}
// 生成僵尸波(与 utils/plants.js buildZombieWave 一致)
function spawnWave(n){
  const count = n===1?cfg.zombie_1_count : n===2?cfg.zombie_2_count : cfg.zombie_3_count;
  const type  = n===1?'normal' : n===2?'cone' : 'bucket';
  for(let i=0;i<count;i++){
    state.zombies.push({id:'z'+Date.now()+'_'+i, type, x:COLS-0.2+i*0.6, y:i%ROWS, hp:ZOMBIES[type].hp, eating:false});
  }
  pushLog(`🧟 侦测到 ${count} 只${ZOMBIES[type].name}入侵!`);
  render();
}

/* ===== 联动核心 3:补做遗漏 → 发樱桃 + 清场 + 回血 ===== */
function goRepair(){
  const missing = Object.keys(subjects).filter(s=>!subjects[s].done);
  if(missing.length===0 && state.zombies.length===0){ toast('今天作业全部完成,花园很安全~'); return; }
  missing.forEach(s=>subjects[s].done=true);
  if(missing.length){
    const done = finishedCount();
    state.sun += done===3 ? cfg.reward_all_bonus : cfg.reward_per_subject;
    if(done===3){ state.streak+=1; state.plants.forEach(p=>p.hp=PLANTS[p.type].hp); }
  }
  state.inv.cherry_bomb += 1;
  state.zombies = [];
  state.plants.forEach(p=> p.hp = PLANTS[p.type].hp);
  coinStolen = true;
  pushLog('🛠️ 补救成功!🍒+1,僵尸已清场,植物回满血');
  toast('🛠️ 补救成功!获得🍒樱桃炸弹');
  saveState(); render(); checkUnfinished();
}

/* ===== 游戏主循环 ===== */
function gameTick(){
  moveZombies();
  plantAttack();
  growPlants();
  render();
}
// 僵尸移动 + 啃食
function moveZombies(){
  state.zombies.forEach(z=>{
    const target = state.plants.filter(p=>p.y===z.y && p.x<=z.x+0.01).sort((a,b)=>b.x-a.x)[0];
    if(target && z.x-target.x<0.35){
      z.eating=true;
      if(!z.lastEat || Date.now()-z.lastEat>1200){
        target.hp -= 1; z.lastEat=Date.now();
        if(target.hp<=0) pushLog(`💀 ${EMOJI[target.type]} 枯萎了`);
      }
      return;
    }
    z.eating=false; z.x -= 0.04;
  });
  state.plants = state.plants.filter(p=>p.hp>0);
  const breached = state.zombies.filter(z=>z.x< -0.5);
  state.zombies = state.zombies.filter(z=>z.x>=-0.5);
  if(breached.length){
    const lost = Math.floor(state.sun*0.3); state.sun=Math.max(0,state.sun-lost);
    pushLog(`🚨 ${breached.length} 只僵尸攻破花园!阳光-${lost}`);
  }
}
// 植物攻击
function plantAttack(){
  state.plants.forEach(p=>{
    const meta=PLANTS[p.type]; if(!meta.attack||meta.oneShot) return;
    const target=state.zombies.filter(z=>z.y===p.y && z.x>=p.x).sort((a,b)=>a.x-b.x)[0];
    if(!target) return;
    if(p._nextAt && Date.now()<p._nextAt) return;
    p._nextAt = Date.now()+(meta.attackInterval||2400);
    state.peaprojs.push({id:'pp'+Date.now()+'_'+Math.random().toString(36).slice(2,5), x:p.x, y:p.y, type:meta.slow?'snow':'pea', targetId:target.id, power:meta.attack});
  });
}
// 弹道推进
function tickProjectiles(){
  const alive=[];
  state.peaprojs.forEach(p=>{
    const t=state.zombies.find(z=>z.id===p.targetId);
    if(!t) return;
    p.x += 0.4;
    if(p.x>=t.x){
      t.hp -= p.power;
      if(t.hp<=0){ pushLog(`🎉 击杀 ${ZEMOJI[t.type]} ☀️+5`); state.sun+=5; }
      return;
    }
    alive.push(p);
  });
  state.peaprojs=alive;
  state.zombies=state.zombies.filter(z=>z.hp>0);
}
// 植物生长:每60s升1阶段
function growPlants(){
  const now=Date.now();
  state.plants.forEach(p=>{
    const meta=PLANTS[p.type]; if(!meta||p.stage>=3) return;
    const want=Math.min(3, Math.floor((now-p.planted_at)/60000)+1);
    if(want>p.stage){ p.stage=want; pushLog(`🌱 ${EMOJI[p.type]} 生长到 ${STAGE_NAMES[want]}`); }
  });
}
// 阳光产出
function produceSun(){
  let n=0; state.plants.forEach(p=>{ if(p.type==='sunflower'&&p.stage>=3) n++; });
  if(n>0 && state.sunTokens.length<3){
    state.sunTokens.push({id:'s'+Date.now(), x:Math.floor(rnd(0,COLS)), y:Math.floor(rnd(0,ROWS)), amount:5*n});
    render();
  }
}

/* ===== 玩家操作(全部走事件委托,容器常驻不销毁,手机点击必达) ===== */
function setMode(txt){
  const bar=$('modeBar');
  if(txt){ $('modeTxt').textContent=txt; bar.classList.add('show'); $('lawn').classList.add('planting'); }
  else { bar.classList.remove('show'); $('lawn').classList.remove('planting'); }
}
function clearMode(){ selectedSeed=null; shovelMode=false; $('shovelTxt').textContent='铲植物'; setMode(null); render(); }

function onSeedTap(type){
  if(!state.shop_unlocked[type]){ toast('🔒 先完成对应学科作业解锁'); return; }
  if(type==='cherry_bomb' && state.inv.cherry_bomb<=0 && state.sun<PLANTS[type].price){ toast('没有樱桃炸弹,补做作业可获得'); return; }
  if(state.sun < PLANTS[type].price && !(type==='cherry_bomb'&&state.inv.cherry_bomb>0)){ toast('☀️ 阳光不足,需要 '+PLANTS[type].price); return; }
  selectedSeed = type; shovelMode=false; $('shovelTxt').textContent='铲植物';
  setMode('已选 '+EMOJI[type]+PLANTS[type].name+' → 点亮闪的空地种下');
  render();
}
function onCell(x,y){
  if(shovelMode){
    const had=state.plants.some(p=>p.x===x&&p.y===y);
    state.plants = state.plants.filter(p=>!(p.x===x&&p.y===y));
    clearMode();
    toast(had?'🔧 已铲除':'这里没有植物');
    saveState(); return;
  }
  if(selectedSeed==='cherry_bomb'){
    if(state.inv.cherry_bomb>0){ state.inv.cherry_bomb--; }
    else if(state.sun>=PLANTS.cherry_bomb.price){ state.sun-=PLANTS.cherry_bomb.price; }
    else { toast('没有樱桃炸弹'); clearMode(); return; }
    useCherryAt(x,y); clearMode(); saveState(); return;
  }
  if(selectedSeed==='wall_nut' && state.inv.wall_nut>0){
    if(state.plants.some(p=>p.x===x&&p.y===y)){ toast('该地块已有植物'); return; }
    state.inv.wall_nut--;
    state.plants.push({id:'p'+Date.now(), type:'wall_nut', subject:null, stage:1, hp:PLANTS.wall_nut.hp, x, y, planted_at:Date.now()});
    clearMode(); toast('🥜 坚果墙就位!'); pushLog('🥜 放置坚果墙'); saveState(); return;
  }
  if(!selectedSeed){ toast('先点下方植物卡选种子'); return; }
  if(state.plants.some(p=>p.x===x&&p.y===y)){ toast('该地块已有植物,换块空地'); return; }
  const meta=PLANTS[selectedSeed];
  if(state.sun<meta.price){ toast('☀️ 阳光不足,需要 '+meta.price); clearMode(); return; }
  state.sun -= meta.price;
  state.plants.push({id:'p'+Date.now(), type:selectedSeed, subject:meta.subject, stage:1, hp:meta.hp, x, y, planted_at:Date.now()});
  pushLog(`🌱 种植 ${meta.name} (${x+1},${y+1})`);
  toast('🌱 '+meta.name+' 种好了!');
  clearMode(); saveState();
}
function useCherryAt(x,y){
  state.blasts.push({id:'b'+Date.now(), x, y, born:Date.now()});
  const before=state.zombies.length;
  state.zombies = state.zombies.filter(z=> !(Math.abs(z.x-x)<=1.2 && Math.abs(z.y-y)<=1));
  const killed=before-state.zombies.length;
  pushLog(`💥 樱桃爆炸!击杀 ${killed} 只僵尸`);
  toast('💥 轰!击杀 '+killed+' 只僵尸');
  state.plants.forEach(p=>{ if(Math.abs(p.x-x)<=1&&Math.abs(p.y-y)<=1) p.hp=Math.min(PLANTS[p.type].hp,p.hp+1); });
  render();
  setTimeout(()=>{ state.blasts=state.blasts.filter(b=>Date.now()-b.born<900); render(); }, 900);
}
function useTool(t){
  if(t==='cherry_bomb'){
    if(state.inv.cherry_bomb<=0){ toast('没有樱桃炸弹,补做作业可获得'); return; }
    selectedSeed='cherry_bomb'; shovelMode=false; setMode('🍒 点击草坪任意位置引爆'); render();
  }
  if(t==='wall_nut'){
    if(state.inv.wall_nut<=0){ toast('没有坚果墙,连续打卡3天免费送'); return; }
    selectedSeed='wall_nut'; shovelMode=false; setMode('🥜 点空地放置坚果墙'); render();
  }
  if(t==='shop') goShop();
  if(t==='repair') goRepair();
  if(t==='shovel'){
    shovelMode=!shovelMode; selectedSeed=null;
    $('shovelTxt').textContent = shovelMode?'取消铲':'铲植物';
    setMode(shovelMode?'🔧 点击要铲除的植物':null); render();
  }
}
function goShop(){
  const locked = SEED_ORDER.filter(t=>!state.shop_unlocked[t]);
  if(locked.length===0){ toast('已全部解锁!'); return; }
  const t = locked[0]; const cost=PLANTS[t].price*2;
  if(state.sun<cost){ toast('☀️ 兑换 '+PLANTS[t].name+' 需 '+cost+' 阳光'); return; }
  state.sun-=cost; state.shop_unlocked[t]=true;
  pushLog(`🛒 商店兑换 ${PLANTS[t].name}`); toast('🛒 兑换成功:'+PLANTS[t].name);
  saveState(); render();
}

/* ===== 测试工具 ===== */
function demoAllDone(){ ['chinese','math','english'].forEach(s=>{ if(!subjects[s].done) finishSubject(s); }); }
function demoMissOne(){
  Object.keys(subjects).forEach(s=>subjects[s].done=false);
  state.zombies=[]; coinStolen=false;
  finishSubject('chinese'); finishSubject('math');
  pushLog('⚠️ 模拟:英语漏做'); checkUnfinished();
}
function resetSave(){ localStorage.removeItem(SAVE_KEY); location.reload(); }

/* ===== 渲染 ===== */
function render(){
  $('sun').textContent=Math.floor(state.sun); $('coin').textContent=state.coin; $('streak').textContent=state.streak;
  $('unlocked').textContent=SEED_ORDER.filter(t=>state.shop_unlocked[t]).length;
  $('invCherry').textContent=state.inv.cherry_bomb; $('invWall').textContent=state.inv.wall_nut;

  // 作业卡片(data-subj 供委托点击)
  $('subjList').innerHTML = Object.keys(subjects).map(s=>{
    const j=subjects[s];
    return `<div class="subj ${j.done?'on':''}" data-subj="${s}">
      <span class="ic">${EMOJI[j.plant]}</span>
      <div><div class="name">${j.name}</div><div class="muted">${j.done?'已完成 ✓':'点击打卡 → 解锁'+PLANTS[j.plant].name}</div></div>
      <span class="arrow">${j.done?'✓':'›'}</span></div>`;
  }).join('');

  // 种子卡(data-seed 供委托点击;sel 高亮当前选中)
  $('seedBar').innerHTML = SEED_ORDER.map(t=>{
    const meta=PLANTS[t]; const locked=!state.shop_unlocked[t];
    return `<div class="seed ${locked?'locked':''} ${selectedSeed===t?'sel':''}" data-seed="${t}">
      <span class="pe">${EMOJI[t]}</span><span class="nm">${meta.name}</span><span class="cost">☀️${meta.price}</span>
      ${locked?'<span class="lock">🔒</span>':''}</div>`;
  }).join('');

  // 草坪(cell 带 data-x/data-y,empty 类用于种植引导高亮)
  let html='';
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const p = state.plants.find(q=>q.x===x&&q.y===y);
      const z = state.zombies.find(q=>Math.round(q.x)===x&&q.y===y);
      const s = state.sunTokens.find(q=>q.x===x&&q.y===y);
      const pr = state.peaprojs.find(q=>Math.round(q.x)===x&&q.y===y);
      const b = state.blasts.find(q=>q.x===x&&q.y===y);
      let inner='';
      if(p){
        const meta=PLANTS[p.type];
        let hpcells=''; for(let i=1;i<=meta.hp;i++) hpcells+=`<i class="${i<=p.hp?'on':''}"></i>`;
        inner+=`<div class="plant ${p.stage>=3?'full':''} ${p.hp<=1?'low':''}">
          <span class="pe">${EMOJI[p.type]}</span></div>
          <span class="stage">${STAGE_NAMES[p.stage]}</span>
          <span class="hp">${hpcells}</span>`;
      }
      if(z) inner+=`<div class="z ${z.eating?'eat':'walk'}">${ZEMOJI[z.type]}</div>`;
      if(s) inner+=`<div class="suntok" data-sunid="${s.id}">☀️${s.amount}</div>`;
      if(pr) inner+=`<div class="proj ${pr.type==='snow'?'snow':''}"></div>`;
      if(b) inner+=`<div class="blast">💥</div>`;
      html+=`<div class="cell ${p?'':'empty'}" data-x="${x}" data-y="${y}">${inner}</div>`;
    }
  }
  $('grid').innerHTML=html;
}

/* ===== 事件委托绑定(核心修复:容器常驻,子节点随便重建) ===== */
// 草坪:种植 / 铲除 / 收阳光
$('grid').addEventListener('click', e=>{
  const sunEl = e.target.closest('.suntok');
  if(sunEl){
    const id=sunEl.dataset.sunid;
    const tok=state.sunTokens.find(s=>s.id===id);
    if(tok){ state.sunTokens=state.sunTokens.filter(s=>s.id!==id); state.sun+=tok.amount; toast('☀️ +'+tok.amount); saveState(); render(); }
    return;
  }
  const cell = e.target.closest('.cell');
  if(cell) onCell(+cell.dataset.x, +cell.dataset.y);
});
// 种子栏
$('seedBar').addEventListener('click', e=>{
  const seed = e.target.closest('.seed');
  if(seed) onSeedTap(seed.dataset.seed);
});
// 作业列表
$('subjList').addEventListener('click', e=>{
  const el = e.target.closest('.subj');
  if(el) finishSubject(el.dataset.subj);
});
// 道具栏
$('toolBar').addEventListener('click', e=>{
  const el = e.target.closest('.tool');
  if(el) useTool(el.dataset.tool);
});
// 模式取消按钮
$('modeCancel').addEventListener('click', clearMode);
// 测试按钮
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-demo]');
  if(!b) return;
  const k=b.dataset.demo;
  if(k==='all') demoAllDone();
  if(k==='miss') demoMissOne();
  if(k==='unlock'){ SEED_ORDER.forEach(t=>state.shop_unlocked[t]=true); toast('🔓 已解锁全部植物'); saveState(); render(); }
  if(k==='reset'){ resetSave(); }
});
// 家长配置输入
['cfgPer','cfgAll','cfgZ1','cfgZ2','cfgZ3'].forEach(id=>{
  $(id).addEventListener('input', ()=>{
    cfg.reward_per_subject=+$('cfgPer').value||5;
    cfg.reward_all_bonus=+$('cfgAll').value||20;
    cfg.zombie_1_count=+$('cfgZ1').value||3;
    cfg.zombie_2_count=+$('cfgZ2').value||6;
    cfg.zombie_3_count=+$('cfgZ3').value||9;
    saveState();
  });
});

/* ===== 启动 ===== */
loadState();
// 恢复家长配置到输入框
$('cfgPer').value=cfg.reward_per_subject; $('cfgAll').value=cfg.reward_all_bonus;
$('cfgZ1').value=cfg.zombie_1_count; $('cfgZ2').value=cfg.zombie_2_count; $('cfgZ3').value=cfg.zombie_3_count;
setInterval(gameTick, 300);
setInterval(produceSun, 4000);
setInterval(tickProjectiles, 200);
setInterval(saveState, 5000);
pushLog('🌻 欢迎来到作业花园!完成作业解锁植物卡');
render(); checkUnfinished();
</script>
</body>
