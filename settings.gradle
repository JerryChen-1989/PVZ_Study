// ============================================
// 全局工程配置（插件与依赖仓库）
// 使用 google() + mavenCentral()，GitHub Actions 云端可直接拉取
// ============================================
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "PvzStudyGarden"
include ':app'
