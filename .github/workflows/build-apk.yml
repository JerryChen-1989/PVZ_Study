# ============================================
# GitHub Actions：云端自动编译 Android APK
#
# 触发方式：
#   1. push 到 main/master 分支      → 自动编译
#   2. 手动触发（Actions 页面点 Run workflow）
#   3. 推 tag（如 v1.0.0）           → 编译并自动发布 Release
#
# 产物下载位置：
#   仓库 → Actions → 选一次运行 → 底部 Artifacts → pvz-study-apk
# ============================================
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（AGP 8.x 要求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Gradle 8.7（与 AGP 8.5.2 兼容；仓库无需带 wrapper jar）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. 编译 Debug + Release APK
      #    （release 使用 debug 签名，下载即可直接安装）
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # 5. 上传 APK 为 Artifact（任何一次运行都能下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvz-study-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      # 6. 推 tag 时自动创建 GitHub Release 并附上 APK
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
